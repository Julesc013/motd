name: Verify
on: [push, pull_request]
permissions:
  contents: read
env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python3 tools/embed_runtime.py --check
      - run: python3 tools/embed_toml.py --check
      - run: bash -n runtime/motd.bash
      - run: sh -n runtime/motd.sh
      - run: sh -n runtime/designs.sh
      - name: Install Unix shells for interpreter and startup tests
        run: sudo apt-get update && sudo apt-get install -y zsh fish busybox mksh ksh
      - name: Require native PowerShell coverage
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Install gallery verification dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -v
        env:
          MOTD_TEST_WRITE_RECORD: '0'
      - run: python3 tools/build_examples.py
      - run: git diff --exit-code -- examples presets
      - name: Verify complete retained terminal capture evidence
        run: python3 tools/build_gallery.py --verify --require-full
      - name: Verify complete design sampler evidence
        run: python3 tools/build_gallery.py --verify --require-sampler --output examples/designs
  python-38:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.8'
      - run: python3 tools/embed_runtime.py --check
      - run: python3 tools/embed_toml.py --check
      - name: Exercise bundled parser and generator on actual Python 3.8
        run: |
          MOTD_TEST_PYTHON38=python3 python3 -m unittest discover -s tests -p test_python_compatibility.py -v
          python3 -m unittest discover -s tests -p test_generation.py -v
          python3 -m unittest discover -s tests -p test_design_configuration.py -v
          python3 -m unittest discover -s tests -p test_portable_export.py -v
          python3 -m unittest discover -s tests -p test_transactions.py -v
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Record actual macOS and built-in interpreters
        run: |
          sw_vers
          /bin/bash --version
          /bin/zsh --version
      - run: python3 tools/embed_runtime.py --check
      - name: Verify generated outputs and local collectors on macOS
        run: python3 -m unittest discover -s tests -p test_native_platforms.py -v
      - name: Record native PowerShell on macOS
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable | Format-List'
      - name: Verify native PowerShell output and local collectors on macOS
        run: python3 -m unittest discover -s tests -p test_powershell.py -v
        env:
          MOTD_TEST_POWERSHELL: pwsh
  powershell-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        interpreter: [powershell, pwsh]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify native output in the selected PowerShell
        shell: pwsh
        run: |
          $env:MOTD_TEST_POWERSHELL = (Get-Command '${{ matrix.interpreter }}' -CommandType Application).Source
          & $env:MOTD_TEST_POWERSHELL -NoProfile -Command '$PSVersionTable | Format-List'
          python -m unittest discover -s tests -p test_powershell.py -v
          exit $LASTEXITCODE
