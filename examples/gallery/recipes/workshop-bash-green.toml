# MOTD recipe. Edit by hand or pass back to motd.py.
# Hooks are explicit executable calls; hints are display-only text.
schema_version = 1
preset = "workshop"
name = "workshop"
target = "shell"
shell = "bash"
audience = "all"
frequency = "login"
public_text = "Authorised access only. Contact the system administrator."
messages = []

[display]
title = "WORKSHOP STATUS"
site = "Workshop"
theme = "green"
charset = "auto"
color = "auto"
design = "classic"
density = "balanced"
detail = "normal"
padding = 1
section_gap = 0
color_emphasis = "balanced"
bar_layout = "inline"
priority = ["attention", "resources", "system", "services", "processes", "io", "sessions", "connections", "hints"]
section_detail = {}
width = 132
rows = 25
top_entries = 3
sections = ["system", "resources", "services", "processes", "sessions", "connections", "attention", "hints"]
show_swap = true
show_compression = true
show_pressure = true

[services]
required = []
exclude = ["ollama*", "llama*", "vllm*", "lmstudio*"]

[collection]
budget_ms = 140
worker_ms = 220
process_limit = 512
io_scan_ms = 35
journal = false

[hooks]
before = []
after = []

[[hints]]
id = "tasks"
label = "Tasks"
command = "top"
note = "CPU and memory"

[[hints]]
id = "io"
label = "I/O"
command = "iotop -o"
note = "If installed and permitted"

[[hints]]
id = "services"
label = "Services"
command = "systemctl --failed"
note = "Failed units"

[[hints]]
id = "sessions"
label = "Sessions"
command = "loginctl list-sessions"
note = "Registered logins"
